name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch pinned llama.cpp
        run: bash scripts/fetch-llama.sh
      - name: Android SDK components
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Keep a stable debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin 2>&1 | tee kotlin.log
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee tests.log
      - name: Debug APK
        run: gradle --no-daemon :app:assembleDebug 2>&1 | tee apk.log
      - uses: actions/upload-artifact@v4
        with:
          name: DropThink-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish rolling debug release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          ls -la app/build/outputs/apk/debug/ 2>&1 | tee release.log
          cp app/build/outputs/apk/debug/*.apk DropThink-debug.apk 2>&1 | tee -a release.log
          (gh release view debug-latest >/dev/null 2>&1 || gh release create debug-latest --prerelease --title "Debug build (latest main)" --notes "Rolling debug APK built by CI." --target "$GITHUB_SHA") 2>&1 | tee -a release.log
          gh release upload debug-latest DropThink-debug.apk --clobber 2>&1 | tee -a release.log
          gh release edit debug-latest --notes "Built from commit $GITHUB_SHA" 2>&1 | tee -a release.log
      - name: Publish build logs
        if: always()
        run: |
          mkdir -p /tmp/l
          cp release.log /tmp/l/release.log 2>/dev/null || true
          for f in kotlin tests apk; do
            [ -f $f.log ] || continue
            grep -nE -B1 -A4 "^e: |error:|FAILED|What went wrong|Execution failed" $f.log | head -150 > /tmp/l/$f-errors.txt || true
            tail -n 120 $f.log > /tmp/l/$f-tail.txt
          done
          cd /tmp/l
          git init -q -b ci-logs
          git config user.email ci@example.com
          git config user.name ci
          git add -A
          git commit -q -m "build logs for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
